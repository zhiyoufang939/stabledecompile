# WEIKU_C tuning. After changing this file, run .\sync_assets.ps1 and rebuild.
# X increases to the right; Y increases downward. All anchors are image centres.

# Animation durations in seconds.
idle_seconds=1.0
shoot_seconds=1.5
fly_seconds=0.8

# Plant display. idle and shoot share these values and are normalized to the
# same displayed canvas width, despite their different source image widths.
plant_display_width=120
plant_scale=0.75
plant_anchor_x=0
plant_anchor_y=20

# Projectile display. These move/scale only the flying artwork.
projectile_scale=0.1
projectile_anchor_x=0
projectile_anchor_y=-12.5

# Projectile creation point relative to the planted cell's top-left corner.
# These values affect both the real projectile position and its collision path.
muzzle_x=90
muzzle_y=32
